name: Build native apps

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            archive: FaceLock-windows-x64.zip
          - runner: ubuntu-22.04
            platform: linux-x64
            archive: FaceLock-linux-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xkb1

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build native application folder
        run: python -m PyInstaller --noconfirm --clean facelock.spec

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/FaceLock" -DestinationPath "${{ matrix.archive }}"

      - name: Package Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_dir="package/FaceLock"
          mkdir -p "$package_dir"
          cp -a dist/FaceLock/. "$package_dir/"
          cat > package/run-facelock.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          script_dir="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          cd "$script_dir/FaceLock"
          exec ./FaceLock "$@"
          EOF
          chmod +x package/run-facelock.sh
          tar -czf "${{ matrix.archive }}" -C package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: facelock-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows and Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: facelock-*
          merge-multiple: true
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: FaceLock ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
